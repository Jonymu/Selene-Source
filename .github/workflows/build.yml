name: Build Selene APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36"

      - name: Prepare android config
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Selene-1.6.8-arm64.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.8
          name: Selene 1.6.8 (arm64)
          files: dist/*
          body: |
            Selene 1.6.8 · android-arm64 · release

            SHA256 见 SHA256SUMS.txt

            国内加速下载（镜像）:
            - https://ghfast.top/https://github.com/Jonymu/Selene-Source/releases/download/v1.6.8/Selene-1.6.8-arm64.apk
            - https://gh-proxy.com/https://github.com/Jonymu/Selene-Source/releases/download/v1.6.8/Selene-1.6.8-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: selene-apk
          path: dist/*
          retention-days: 14
