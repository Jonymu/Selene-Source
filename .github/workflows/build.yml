name: Build Selene APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: selene-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: '1.6.8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36"

      - name: Prepare android config
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          NAME="Selene-${APP_VERSION}-b${GITHUB_RUN_NUMBER}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: selene-apk-b${{ github.run_number }}
          path: dist/*
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-b${{ github.run_number }}
          name: Selene ${{ env.APP_VERSION }} (arm64, build ${{ github.run_number }})
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Selene ${{ env.APP_VERSION }} · android-arm64 · 构建 ${{ github.run_number }}

            产物: `Selene-${{ env.APP_VERSION }}-b${{ github.run_number }}-arm64.apk`
            SHA256 见 SHA256SUMS.txt

            国内加速下载（把下面链接里的文件名替换成本次构建的文件名）:
            - https://ghfast.top/https://github.com/Jonymu/Selene-Source/releases/download/v${{ env.APP_VERSION }}-b${{ github.run_number }}/Selene-${{ env.APP_VERSION }}-b${{ github.run_number }}-arm64.apk
            - https://gh-proxy.com/https://github.com/Jonymu/Selene-Source/releases/download/v${{ env.APP_VERSION }}-b${{ github.run_number }}/Selene-${{ env.APP_VERSION }}-b${{ github.run_number }}-arm64.apk
